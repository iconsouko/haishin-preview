<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配信プレビューさん | カスタム背景の見え方チェック</title>
<meta name="description" content="ColorSingのカスタム背景が配信画面でどう見えるか確認できるプレビューです。">

<style>
:root{
  --ink:20 19 28;
  --panel:29 27 41;
  --line:51 47 68;
  --paper:250 247 241;
  --muted:199 194 214;
  --coral:255 111 89;
  --teal:47 182 166;
  --gold:245 185 66;
}

html.light{
  --ink:250 247 241;
  --panel:255 255 255;
  --line:224 219 232;
  --paper:30 27 41;
  --muted:96 90 112;
}

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
  margin:0;
}

body{
  background:rgb(var(--ink));
  color:rgb(var(--paper));
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
}

header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  max-width:700px;
  margin:0 auto;
  padding:32px 24px 0;
}

header h1{
  margin:0;
  font-size:26px;
  letter-spacing:.02em;
}

header p{
  margin:4px 0 0;
  font-size:13px;
  color:rgb(var(--muted));
}

.theme-btn{
  flex-shrink:0;
  width:36px;
  height:36px;
  border-radius:999px;
  border:2px solid rgb(var(--line));
  background:rgb(var(--panel));
  color:rgb(var(--paper));
  font-size:16px;
  cursor:pointer;
}

main{
  max-width:700px;
  margin:0 auto;
  padding:24px;
}

.upload-btn{
  width:100%;
  padding:20px;
  border-radius:20px;
  border:2px solid rgb(var(--teal)/.4);
  background:rgb(var(--teal)/.1);
  color:rgb(var(--teal));
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

@keyframes softPulse{
  0%,100%{opacity:1}
  50%{opacity:.55}
}

.pulse{
  animation:softPulse 1.8s ease-in-out infinite;
}

.preview{
  position:relative;
  margin-top:16px;
  width:100%;
  aspect-ratio:1536/2048;
  border-radius:20px;
  border:2px solid rgb(var(--line));
  background:rgb(var(--panel));
  overflow:hidden;
}

#canvas{
  width:100%;
  height:100%;
  display:block;
}

.shade{
  position:absolute;
  top:0;
  bottom:0;
  background:rgba(0,0,0,.55);
  pointer-events:none;
  width:0;
  z-index:80;
}

.shade.left{
  left:0;
  border-right:2px dashed rgba(255,255,255,.85);
}

.shade.right{
  right:0;
  border-left:2px dashed rgba(255,255,255,.85);
}

.badge{
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  border-radius:999px;
  padding:6px 14px;
  font-size:11px;
  font-weight:700;
  color:rgb(var(--ink));
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  display:none;
  z-index:100;
}

.badge.warn{
  background:rgb(var(--gold));
}

.badge.ok{
  background:rgb(var(--teal));
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 32px;
  font-size:14px;
  color:rgb(var(--paper)/.5);
  pointer-events:none;
  z-index:2;
}

/* ==========================================================
   ダミーUI
   公式テンプレート画像・公式素材は使用しない。
   1536×2048を基準に、テンプレートから読み取った
   座標・サイズのみをCSSで再現する。
========================================================== */

#uiGuide{
  position:absolute;
  inset:0;
  display:none;
  pointer-events:none;
  z-index:30;
}

#uiGuide.visible{
  display:block;
}

.fake-ui{
  position:absolute;
  color:#fff;
  user-select:none;
  text-shadow:0 1px 3px rgba(0,0,0,.55);
}

/* ----------------------------------------------------------
   配信者アイコン
---------------------------------------------------------- */

.creator-avatar{
  position:absolute;
  left:calc(314 / 1536 * 100%);
  top:calc(116 / 2048 * 100%);
  width:calc(102 / 1536 * 100%);
  aspect-ratio:1;
  border-radius:50%;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.9);
  background:linear-gradient(
    135deg,
    #ffd166,
    #ef476f 45%,
    #8338ec
  );
  box-shadow:0 2px 7px rgba(0,0,0,.35);
}

.creator-avatar::before{
  content:"A";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(16px,3vw,30px);
  font-weight:900;
  color:#fff;
}

.creator-name{
  left:calc(426 / 1536 * 100%);
  top:calc(127 / 2048 * 100%);
  width:calc(250 / 1536 * 100%);
  height:calc(34 / 2048 * 100%);
  display:flex;
  align-items:center;
  font-size:clamp(7px,1.35vw,15px);
  font-weight:800;
}

.creator-info{
  left:calc(426 / 1536 * 100%);
  top:calc(175 / 2048 * 100%);
  width:calc(316 / 1536 * 100%);
  height:calc(34 / 2048 * 100%);
  display:flex;
  align-items:center;
  font-size:clamp(6px,1.1vw,13px);
  opacity:.92;
}

/* ----------------------------------------------------------
   リスナーアイコン
---------------------------------------------------------- */

.listener-avatar{
  position:absolute;

  aspect-ratio:1;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 2px 7px rgba(0,0,0,.3);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(7px,1.3vw,14px);
  font-weight:900;
  color:#fff;
}

.listener-avatar.a{
  left:calc(769 / 1536 * 100%);
  top:calc(131 / 2048 * 100%);
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

.listener-avatar.b{
  left:calc(878 / 1536 * 100%);
  top:calc(131 / 2048 * 100%);
  background:linear-gradient(135deg,#a18cd1,#fbc2eb);
}

.listener-avatar.c{
  left:calc(959 / 1536 * 100%);
  top:calc(131 / 2048 * 100%);
  background:linear-gradient(135deg,#84fab0,#8fd3f4);
}

.listener-avatar.d{

  top:calc(131 / 2048 * 100%);
  background:linear-gradient(135deg,#f6d365,#fda085);
}

/* ----------------------------------------------------------
   閉じるボタン
---------------------------------------------------------- */

.close-button{
  left:calc(1173 / 1536 * 100%);
  top:calc(139 / 2048 * 100%);
  width:calc(55 / 1536 * 100%);
  height:calc(55 / 2048 * 100%);
  display:flex;
  align-items:center;
  justify-content:center;

}

/* ----------------------------------------------------------
   歌詞

---------------------------------------------------------- */

.lyrics{

  left:50%;
  top:47%;

  font-size:clamp(9px,2.1vw,23px);

.comment-area{
  position:absolute;
  left:calc(315 / 1536 * 100%);
  top:calc(1225 / 2048 * 100%);
  width:calc(805 / 1536 * 100%);
  height:calc(597 / 2048 * 100%);

  justify-content:flex-end;

.comment{

  margin-top:1.5%;
  padding:1.25% 2.5%;
  border-radius:999px;
  background:rgba(45,45,55,.76);
  color:#fff;

  font-weight:700;
  line-height:1.25;

.comment.highlight{

.bottom-button.one{

.bottom-button.two{
  left:calc(1024 / 1536 * 100%);

/* ----------------------------------------------------------

---------------------------------------------------------- */

.device-panel{
  margin-top:16px;

  border-radius:20px;

  background:rgb(var(--panel));

}

.device-panel.prompt{

.device-panel .label{

.device-card{

.device-card .row{

.device-card .dot{

  border:2px solid rgb(var(--line));

  justify-content:center;
}

.device-card.active .dot{

}

.device-card.active .dot::after{

}

.device-card .ratio{

}

.device-note{

  font-size:12px;

  color:rgb(var(--muted));
}
</style>
</head>

<body>

<header>

  <div>
    <h1>配信プレビューさん</h1>
    <p>カスタム背景が配信でどう見えるか確認できます</p>
  </div>

  <button
    class="theme-btn"
    id="themeBtn"
    aria-label="ライト/ダークモード切替"
  >
    🌙
  </button>

</header>

<main>

  <!-- 画像アップロード -->

  <button
    class="upload-btn pulse"
    id="uploadBtn"
  >
    🖼 画像をアップロード
  </button>

  <input
    type="file"
    id="fileInput"
    accept="image/png,image/jpeg,image/webp"
    style="display:none"
  >

  <!-- プレビュー -->

  <div
    class="preview"
    id="preview"
  >

    <canvas
      id="canvas"
      width="1536"
      height="2048"
    ></canvas>

    <!-- 左右の見切れ範囲 -->

    <div
      class="shade left"
      id="shadeLeft"
    ></div>

    <div
      class="shade right"
      id="shadeRight"
    ></div>

    <!-- 端末表示バッジ -->

    <div
      class="badge"
      id="badge"
    ></div>

    <!-- 画像未選択時 -->

    <div
      class="placeholder"
      id="placeholder"
    >
      画像をアップロードすると、<br>
      配信画面を再現したプレビューを表示します
    </div>

    <!-- ====================================================
         ダミー配信UI
    ==================================================== -->

    <div id="uiGuide">

      <!-- 配信者 -->

      <div class="creator-avatar"></div>

      <div class="creator-name fake-ui">
        配信者A
      </div>

      <div class="creator-info fake-ui">
        ♡ 33　配信中
      </div>


      <!-- リスナーアイコン -->

      <div class="listener-avatar a">
        A
      </div>

      <div class="listener-avatar b">
        B
      </div>

      <div class="listener-avatar c">
        C
      </div>

      <div class="listener-avatar d">
        D
      </div>


      <!-- 閉じる -->

      <div class="close-button fake-ui">
        ×
      </div>


      <!-- 歌詞 -->

      <div class="lyrics">
        ここには歌詞が表示される
      </div>


      <!-- コメント欄 -->

      <div class="comment-area">

        <div class="comment">
          <span class="name">リスナーA</span>
          こんにちは！
        </div>

        <div class="comment highlight">
          <span class="name">リスナーB</span>
          素敵な歌声です！
        </div>

        <div class="comment">

          今日も楽しみにしてました
        </div>

        <div class="comment highlight">
          <span class="name">リスナーD</span>
          👏👏👏
        </div>

        <div class="comment">
          <span class="name">リスナーE</span>
          ありがとうございます！
        </div>

        <div class="comment">
          <span class="name">リスナーF</span>
          次の曲も楽しみです
        </div>

        <div class="comment highlight">
          <span class="name">リスナーG</span>
          すごく綺麗です✨
        </div>

        <div class="comment">
          <span class="name">リスナーH</span>
          聴いてます！
        </div>

      </div>


      <!-- 右側ボタン -->

      <div class="side-button one">
        ♡
      </div>

      <div class="side-button two">
        🎁
      </div>

      <div class="side-button three">
        ♪
      </div>


      <!-- コメント入力 -->

      <div class="comment-input">
        コメントを入力…
      </div>


      <!-- 最下段ボタン -->

      <div class="bottom-button one">

    <!-- UI表示切替 -->

    <p

  </div>

</main>


<script>
(function(){

  const CANVAS_WIDTH = 1536;
  const CANVAS_HEIGHT = 2048;


  /*
   * 端末情報
   */

  const DEVICES = [

    {
      id:"iphone",
      label:"iPhone",
      ratioLabel:"19.5:9",
      aspect:1179/2556,
      note:"上下は画面いっぱい、左右が見切れます"
    },

    {
      id:"xperia10vi",
      label:"Xperia 10 VI",
      ratioLabel:"21:9",
      aspect:1080/2520,
      note:"上下は画面いっぱい、左右が大きく見切れます"
    },

    {
      id:"other-major",
      label:"その他の主要スマホ",
      ratioLabel:"20:9目安",
      aspect:9/20,
      note:"iPhone/Xperia以外の機種の目安です"
    },

    {
      id:"ipad",
      label:"iPad（A16）",
      ratioLabel:"59:41",
      aspect:1640/2360,
      note:"上下左右とも、ほぼ画面いっぱいに表示されます"
    }

  ];


  /*
   * DOM
   */

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");

  const uploadBtn =
    document.getElementById("uploadBtn");

  const fileInput =
    document.getElementById("fileInput");

  const overlayGuide =
    document.getElementById("uiGuide");

  const shadeLeft =
    document.getElementById("shadeLeft");

  const shadeRight =
    document.getElementById("shadeRight");

  const badge =
    document.getElementById("badge");

  const placeholder =
    document.getElementById("placeholder");

  const uiToggleBtn =
    document.getElementById("uiToggleBtn");

  const devicePanel =
    document.getElementById("devicePanel");

  const deviceGrid =
    document.getElementById("deviceGrid");

  const deviceNote =
    document.getElementById("deviceNote");

  const themeBtn =
    document.getElementById("themeBtn");


  /*
   * 状態
   */

  let bgImage = null;

  let selectedDeviceId = null;

  let showUiGuide = false;


  /*
   * 背景描画
   *
   * ColorSingの仕様に合わせて、
   * 高さ2048pxを画面いっぱいに合わせる。
   *
   * 横方向は画面比率によって切り取られる。
   */

  function draw(){

    ctx.clearRect(
      0,
      0,
      CANVAS_WIDTH,
      CANVAS_HEIGHT
    );


    /*
     * 画像未選択
     */

    if(!bgImage){

      const grad =
        ctx.createLinearGradient(
          0,
          0,
          0,
          CANVAS_HEIGHT
        );

      grad.addColorStop(
        0,
        "#1D1B29"
      );

      grad.addColorStop(
        1,
        "#14131C"
      );

      ctx.fillStyle = grad;

      ctx.fillRect(
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
      );

      placeholder.style.display =
        "flex";

      return;
    }


    placeholder.style.display =
      "none";


    /*
     * 縦方向を画面いっぱいにする
     */

    const scale =
      CANVAS_HEIGHT / bgImage.height;

    const dw =
      bgImage.width * scale;

    const dh =
      CANVAS_HEIGHT;

    const dx =
      (CANVAS_WIDTH - dw) / 2;

    const dy =
      0;


    ctx.drawImage(
      bgImage,
      dx,
      dy,
      dw,
      dh
    );

  }


  /*
   * 端末比率による左右の見切れ幅
   */

  function cropMarginX(aspect){

    const visibleWidthFraction =
      aspect *
      (CANVAS_HEIGHT / CANVAS_WIDTH);

    return Math.max(
      0,
      (1 - visibleWidthFraction) / 2
    );

  }


  /*
   * オーバーレイ更新
   */

  function updateOverlays(){

    const device =
      DEVICES.find(
        d => d.id === selectedDeviceId
      ) || null;


    if(device){

      const margin =
        cropMarginX(device.aspect);


      if(margin > 0.001){

        shadeLeft.style.width =
          (margin * 100) + "%";

        shadeRight.style.width =
          (margin * 100) + "%";

        badge.style.display =
          "block";

        badge.className =
          "badge warn";

        badge.textContent =
          "⚠️ " +
          device.label +
          "は左右が見切れます";

      }else{

        shadeLeft.style.width =
          "0%";

        shadeRight.style.width =
          "0%";

        badge.style.display =
          "block";

        badge.className =
          "badge ok";

        badge.textContent =
          "✅ " +
          device.label +
          "はほぼ全体が見えます";

      }


      deviceNote.textContent =
        device.note;

    }else{

      shadeLeft.style.width =
        "0%";

      shadeRight.style.width =
        "0%";

      badge.style.display =
        "none";

      deviceNote.textContent =
        "";

    }


    overlayGuide.classList.toggle(
      "visible",
      showUiGuide
    );

    uiToggleBtn.classList.toggle(
      "active",
      showUiGuide
    );

    devicePanel.classList.toggle(
      "prompt",
      !!bgImage && !selectedDeviceId
    );

  }


  /*
   * HTMLエスケープ
   */

  function escapeHtml(value){

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /*
   * 端末ボタン生成
   */

  function renderDeviceButtons(){

    deviceGrid.innerHTML = "";


    DEVICES.forEach(
      device => {

        const btn =
          document.createElement(
            "button"
          );

        btn.type =
          "button";

        btn.className =
          "device-card" +
          (
            selectedDeviceId === device.id
              ? " active"
              : ""
          );


        btn.innerHTML =

          '<span class="row">' +

            '<span class="dot"></span>' +

            '<span class="name">' +

              escapeHtml(
                device.label
              ) +

            '</span>' +

          '</span>' +

          '<span class="ratio">' +

            escapeHtml(
              device.ratioLabel
            ) +

          '</span>';


        btn.addEventListener(
          "click",
          () => {

            selectedDeviceId =
              selectedDeviceId === device.id
                ? null
                : device.id;


            renderDeviceButtons();

            updateOverlays();

          }
        );


        deviceGrid.appendChild(
          btn
        );

      }
    );

  }


  /*
   * アップロードボタン
   */

  uploadBtn.addEventListener(
    "click",
    () => {

      fileInput.click();

    }
  );


  /*
   * ファイル選択
   */

  fileInput.addEventListener(
    "change",
    event => {

      const file =
        event.target.files &&
        event.target.files[0];


      if(!file){

        return;

      }


      /*
       * 画像ファイル確認
       */

      if(
        !file.type.startsWith(
          "image/"
        )
      ){

        alert(
          "画像ファイルを選択してください。"
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        () => {

          const img =
            new Image();


          img.onload =
            () => {

              bgImage =
                img;


              uploadBtn.textContent =
                "🔄 画像を変更する";


              uploadBtn.classList.remove(
                "pulse"
              );


              draw();

              updateOverlays();

            };


          img.onerror =
            () => {

              alert(
                "画像を読み込めませんでした。"
              );

            };


          img.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );


  /*
   * ダミーUI表示切替
   */

  uiToggleBtn.addEventListener(
    "click",
    () => {

      showUiGuide =
        !showUiGuide;

      updateOverlays();

    }
  );


  /*
   * テーマ
   */

  const THEME_KEY =
    "haishin-preview:theme";


  function applyTheme(theme){

    document.documentElement
      .classList
      .toggle(
        "light",
        theme === "light"
      );


    themeBtn.textContent =
      theme === "light"
        ? "☀️"
        : "🌙";

  }


  applyTheme(
    localStorage.getItem(
      THEME_KEY
    ) || "dark"
  );


  themeBtn.addEventListener(
    "click",
    () => {

      const current =
        document.documentElement
          .classList
          .contains("light")
          ? "light"
          : "dark";


      const next =
        current === "light"
          ? "dark"
          : "light";


      applyTheme(next);


      localStorage.setItem(
        THEME_KEY,
        next
      );

    }
  );


  /*
   * 初期化
   */

  renderDeviceButtons();

  draw();

  updateOverlays();

})();
</script>

</body>
</html>
