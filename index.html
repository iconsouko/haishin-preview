<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>配信プレビューさん | カスタム背景の見え方チェック</title>
<meta name="description" content="ColorSingのカスタム背景画像が、実際の配信でどう見えるかを確認できるツールです。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: 20 19 28;
    --panel: 29 27 41;
    --line: 51 47 68;
    --paper: 250 247 241;
    --muted: 199 194 214;
    --coral: 255 111 89;
    --teal: 47 182 166;
    --gold: 245 185 66;
  }
  html.light {
    --ink: 250 247 241;
    --panel: 255 255 255;
    --line: 224 219 232;
    --paper: 30 27 41;
    --muted: 96 90 112;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: rgb(var(--ink));
    color: rgb(var(--paper));
    font-family: 'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s ease, color .25s ease;
  }
  .display { font-family: 'Reggae One', cursive; }
  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 24px;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 24px 0;
  }
  header h1 { margin: 0; font-size: 26px; letter-spacing: .02em; }
  header p { margin: 4px 0 0; font-size: 13px; color: rgb(var(--muted)); }
  .theme-btn {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 999px;
    border: 2px solid rgb(var(--line));
    background: rgb(var(--panel));
    font-size: 16px;
    cursor: pointer;
  }
  .upload-btn {
    width: 100%;
    padding: 20px;
    border-radius: 20px;
    border: 2px solid rgb(var(--teal) / .4);
    background: rgb(var(--teal) / .1);
    color: rgb(var(--teal));
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  @keyframes softPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .55; }
  }
  .pulse { animation: softPulse 1.8s ease-in-out infinite; }
  .preview {
    position: relative;
    margin-top: 16px;
    width: 100%;
    aspect-ratio: 1536 / 2048;
    border-radius: 20px;
    border: 2px solid rgb(var(--line));
    background: rgb(var(--panel));
    overflow: hidden;
  }
  .preview canvas { width: 100%; height: 100%; display: block; }
  .preview .overlay-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: .4;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .shade {
    position: absolute; top: 0; bottom: 0;
    background: rgba(0,0,0,.55);
    pointer-events: none;
    width: 0%;
  }
  .shade.left { left: 0; border-right: 2px dashed rgba(255,255,255,.85); }
  .shade.right { right: 0; border-left: 2px dashed rgba(255,255,255,.85); }
  .badge {
    position: absolute; top: 8px; left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 700;
    color: rgb(var(--ink));
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    display: none;
  }
  .badge.warn { background: rgb(var(--gold)); }
  .badge.ok { background: rgb(var(--teal)); }
  .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 0 32px;
    font-size: 14px; color: rgb(var(--paper) / .5);
    pointer-events: none;
  }
  .ui-toggle {
    position: absolute; right: 8px; bottom: 8px;
    width: 40px; height: 40px;
    border-radius: 999px; border: none;
    font-size: 18px; cursor: pointer;
    background: rgb(var(--ink) / .7);
    color: rgb(var(--paper));
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .ui-toggle.active {
    background: rgb(var(--coral));
    color: rgb(var(--ink));
  }
  .device-panel {
    margin-top: 16px;
    border-radius: 20px;
    border: 2px solid rgb(var(--line));
    background: rgb(var(--panel));
    padding: 20px;
  }
  .device-panel.prompt {
    border-color: rgb(var(--coral));
    animation: softPulse 1.8s ease-in-out infinite;
  }
  .device-panel .label {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 700;
    color: rgb(var(--muted));
  }
  .device-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  @media (min-width: 480px) {
    .device-grid { grid-template-columns: repeat(4, 1fr); }
  }
  .device-card {
    text-align: left;
    border-radius: 16px;
    border: 2px solid rgb(var(--line));
    background: transparent;
    color: rgb(var(--paper));
    padding: 12px;
    cursor: pointer;
  }
  .device-card.active {
    border-color: rgb(var(--coral));
    background: rgb(var(--coral) / .1);
  }
  .device-card .row {
    display: flex; align-items: center; gap: 8px;
  }
  .device-card .dot {
    width: 16px; height: 16px; border-radius: 999px;
    border: 2px solid rgb(var(--line));
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .device-card.active .dot { border-color: rgb(var(--coral)); }
  .device-card.active .dot::after {
    content: '';
    width: 8px; height: 8px; border-radius: 999px;
    background: rgb(var(--coral));
  }
  .device-card .name { font-size: 13px; font-weight: 700; }
  .device-card .ratio { display: block; margin-top: 4px; font-size: 11px; color: rgb(var(--muted)); }
  .device-note { margin-top: 8px; font-size: 12px; color: rgb(var(--muted)); }
</style>
</head>
<body>
<header>
  <div>
    <h1 class="display">配信プレビューさん</h1>
    <p>カスタム背景が配信でどう見えるか確認できます</p>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="ライト/ダークモード切替">🌙</button>
</header>

<main>
  <button class="upload-btn pulse" id="uploadBtn">🖼 画像をアップロード</button>
  <input type="file" id="fileInput" accept="image/png,image/jpeg" style="display:none" />

<script>
(function () {
  var CANVAS_WIDTH = 1536, CANVAS_HEIGHT = 2048;

  var DEVICES = [
    { id: 'iphone', label: 'iPhone', ratioLabel: '19.5:9', aspect: 1179/2556, note: '上下は画面いっぱい、左右が見切れます' },
    { id: 'xperia10vi', label: 'Xperia 10 VI', ratioLabel: '21:9', aspect: 1080/2520, note: '上下は画面いっぱい、左右が大きく見切れます' },
    { id: 'other-major', label: 'その他の主要スマホ', ratioLabel: '20:9目安', aspect: 9/20, note: 'iPhone/Xperia以外の機種の目安です（Galaxy・Pixelなど）' },
    { id: 'ipad', label: 'iPad（A16）', ratioLabel: '59:41', aspect: 1640/2360, note: '上下左右とも、ほぼ画面いっぱいに表示されます' }
  ];

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var uploadBtn = document.getElementById('uploadBtn');
  var fileInput = document.getElementById('fileInput');
  var overlayImg = document.getElementById('overlayImg');
  var shadeLeft = document.getElementById('shadeLeft');
  var shadeRight = document.getElementById('shadeRight');
  var badge = document.getElementById('badge');
  var placeholder = document.getElementById('placeholder');
  var uiToggleBtn = document.getElementById('uiToggleBtn');
  var devicePanel = document.getElementById('devicePanel');
  var deviceGrid = document.getElementById('deviceGrid');
  var deviceNote = document.getElementById('deviceNote');
  var themeBtn = document.getElementById('themeBtn');

  var bgImage = null;
  var selectedDeviceId = null;
  var showUiGuide = false;

  function draw() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    if (!bgImage) {
      var grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      grad.addColorStop(0, '#1D1B29');
      grad.addColorStop(1, '#14131C');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      placeholder.style.display = 'flex';
      return;
    }
    placeholder.style.display = 'none';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    var scale = Math.min(CANVAS_WIDTH / bgImage.width, CANVAS_HEIGHT / bgImage.height);
    var dw = bgImage.width * scale, dh = bgImage.height * scale;
    var dx = (CANVAS_WIDTH - dw) / 2, dy = (CANVAS_HEIGHT - dh) / 2;
    ctx.drawImage(bgImage, dx, dy, dw, dh);
  }

  function cropMarginX(aspect) {
    var visibleWidthFraction = aspect * (CANVAS_HEIGHT / CANVAS_WIDTH);
    var margin = (1 - visibleWidthFraction) / 2;
    return Math.max(0, margin);
  }

  function updateOverlays() {
    var device = DEVICES.filter(function (d) { return d.id === selectedDeviceId; })[0] || null;
    if (device) {
      var margin = cropMarginX(device.aspect);
      if (margin > 0.001) {
        shadeLeft.style.width = (margin * 100) + '%';
        shadeRight.style.width = (margin * 100) + '%';
        badge.style.display = 'block';
        badge.className = 'badge warn';
        badge.textContent = '⚠️ ' + device.label + 'は左右が見切れます';
      } else {
        shadeLeft.style.width = '0%';
        shadeRight.style.width = '0%';
        badge.style.display = 'block';
        badge.className = 'badge ok';
        badge.textContent = '✅ ' + device.label + 'はほぼ全体が見えます';
      }
      deviceNote.textContent = device.note;
    } else {
      shadeLeft.style.width = '0%';
      shadeRight.style.width = '0%';
      badge.style.display = 'none';
      deviceNote.textContent = '';
    }

    overlayImg.style.display = showUiGuide ? 'block' : 'none';
    uiToggleBtn.classList.toggle('active', showUiGuide);

    devicePanel.classList.toggle('prompt', !!bgImage && !selectedDeviceId);
  }

  function renderDeviceButtons() {
    deviceGrid.innerHTML = '';
    DEVICES.forEach(function (d) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'device-card' + (selectedDeviceId === d.id ? ' active' : '');
      btn.innerHTML =
        '<span class="row"><span class="dot"></span><span class="name">' + d.label + '</span></span>' +
        '<span class="ratio">' + d.ratioLabel + '</span>';
      btn.addEventListener('click', function () {
        selectedDeviceId = (selectedDeviceId === d.id) ? null : d.id;
        renderDeviceButtons();
        updateOverlays();
      });
      deviceGrid.appendChild(btn);
    });
  }

  uploadBtn.addEventListener('click', function () { fileInput.click(); });

  fileInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        bgImage = img;
        uploadBtn.textContent = '🔄 画像を変更する';
        uploadBtn.classList.remove('pulse');
        draw();
        updateOverlays();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  uiToggleBtn.addEventListener('click', function () {
    showUiGuide = !showUiGuide;
    updateOverlays();
  });

  var THEME_KEY = 'haishin-preview:theme';
  function applyTheme(theme) {
    document.documentElement.classList.toggle('light', theme === 'light');
    themeBtn.textContent = theme === 'light' ? '☀️' : '🌙';
  }
  var savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
  applyTheme(savedTheme);
  themeBtn.addEventListener('click', function () {
    var current = document.documentElement.classList.contains('light') ? 'light' : 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem(THEME_KEY, next);
  });

  renderDeviceButtons();
  draw();
  updateOverlays();
})();
</script>
</body>
</html>
