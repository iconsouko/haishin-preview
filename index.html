<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配信プレビューさん | カスタム背景の見え方チェック</title>
<meta name="description" content="ColorSingのカスタム背景が配信画面でどう見えるか確認できるプレビューです。">

<style>
:root{
  --ink:20 19 28;
  --panel:29 27 41;
  --line:51 47 68;
  --paper:250 247 241;
  --muted:199 194 214;
  --coral:255 111 89;
  --teal:47 182 166;
  --gold:245 185 66
}

html.light{
  --ink:250 247 241;
  --panel:255 255 255;
  --line:224 219 232;
  --paper:30 27 41;
  --muted:96 90 112
}

*{
  box-sizing:border-box
}

html,body{
  height:100%;
  margin:0
}

body{
  background:rgb(var(--ink));
  color:rgb(var(--paper));
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased
}

button{
  font:inherit
}

header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  max-width:700px;
  margin:auto;
  padding:32px 24px 0
}

header h1{
  margin:0;
  font-size:26px;
  letter-spacing:.02em
}

header p{
  margin:4px 0 0;
  font-size:13px;
  color:rgb(var(--muted))
}

.theme-btn{
  flex-shrink:0;
  width:36px;
  height:36px;
  border-radius:999px;
  border:2px solid rgb(var(--line));
  background:rgb(var(--panel));
  color:rgb(var(--paper));
  font-size:16px;
  cursor:pointer
}

main{
  max-width:700px;
  margin:auto;
  padding:24px
}

.upload-btn{
  width:100%;
  padding:20px;
  border-radius:20px;
  border:2px solid rgb(var(--teal)/.4);
  background:rgb(var(--teal)/.1);
  color:rgb(var(--teal));
  font-size:16px;
  font-weight:700;
  cursor:pointer
}

@keyframes softPulse{
  0%,100%{opacity:1}
  50%{opacity:.55}
}

.pulse{
  animation:softPulse 1.8s ease-in-out infinite
}

.preview{
  position:relative;
  margin-top:16px;
  width:100%;
  aspect-ratio:1536/2048;
  border-radius:20px;
  border:2px solid rgb(var(--line));
  background:rgb(var(--panel));
  overflow:hidden
}

#canvas{
  width:100%;
  height:100%;
  display:block
}


/* =========================================================
   見切れ部分
   ========================================================= */

.shade{
  position:absolute;
  top:0;
  bottom:0;
  background:rgba(0,0,0,.55);
  pointer-events:none;
  width:0;
  z-index:80
}

.shade.left{
  left:0
}

.shade.right{
  right:0
}


/* =========================================================
   左右の境界線
   shadeとは完全に独立させる
   ========================================================= */

.crop-line{
  position:absolute;
  top:0;
  bottom:0;
  width:0;
  border-left:2px dashed rgba(255,255,255,.9);
  pointer-events:none;
  z-index:95;
  display:none;
}

.crop-line.left{
  left:0;
}

.crop-line.right{
  left:0;
}


/* ========================================================= */

.badge{
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  border-radius:999px;
  padding:6px 14px;
  font-size:11px;
  font-weight:700;
  color:rgb(var(--ink));
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  display:none;
  z-index:100
}

.badge.warn{
  background:rgb(var(--gold))
}

.badge.ok{
  background:rgb(var(--teal))
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 32px;
  font-size:14px;
  color:rgb(var(--paper)/.5);
  pointer-events:none;
  z-index:2
}

#uiGuide{
  position:absolute;
  inset:0;
  display:none;
  pointer-events:none;
  z-index:30
}

#uiGuide.visible{
  display:block
}

.fake-ui{
  position:absolute;
  color:#fff;
  user-select:none;
  text-shadow:0 1px 3px rgba(0,0,0,.55)
}

.creator-avatar{
  position:absolute;
  left:calc(314 / 1536 * 100%);
  top:calc(116 / 2048 * 100%);
  width:calc(102 / 1536 * 100%);
  aspect-ratio:1;
  border-radius:50%;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.9);
  background:linear-gradient(135deg,#ffd166,#ef476f 45%,#8338ec);
  box-shadow:0 2px 7px rgba(0,0,0,.35)
}

.creator-avatar:before{
  content:"A";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(16px,3vw,30px);
  font-weight:900;
  color:#fff
}

.creator-name{
  left:calc(426 / 1536 * 100%);
  top:calc(127 / 2048 * 100%);
  width:calc(250 / 1536 * 100%);
  height:calc(34 / 2048 * 100%);
  display:flex;
  align-items:center;
  font-size:clamp(7px,1.35vw,15px);
  font-weight:800
}

.creator-info{
  left:calc(426 / 1536 * 100%);
  top:calc(175 / 2048 * 100%);
  width:calc(316 / 1536 * 100%);
  height:calc(34 / 2048 * 100%);
  display:flex;
  align-items:center;
  font-size:clamp(6px,1.1vw,13px);
  opacity:.92
}

.listener-avatar{
  position:absolute;
  width:calc(71 / 1536 * 100%);
  aspect-ratio:1;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 2px 7px rgba(0,0,0,.3);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(7px,1.3vw,14px);
  font-weight:900;
  color:#fff
}

.listener-avatar.a{
  left:calc(769 / 1536 * 100%);
  top:calc(131 / 2048 * 100%);
  background:linear-gradient(135deg,#ff9a9e,#fad0c4)
}

.listener-avatar.b{
  left:calc(878 / 1536 * 100%);
  top:calc(131 / 2048 * 100%);
  background:linear-gradient(135deg,#a18cd1,#fbc2eb)
}

.listener-avatar.c{
  left:calc(959 / 1536 * 100%);
  top:calc(131 / 2048 * 100%);
  background:linear-gradient(135deg,#84fab0,#8fd3f4)
}

.listener-avatar.d{
  left:calc(1040 / 1536 * 100%);
  top:calc(131 / 2048 * 100%);
  background:linear-gradient(135deg,#f6d365,#fda085)
}

.close-button{
  left:calc(1173 / 1536 * 100%);
  top:calc(139 / 2048 * 100%);
  width:calc(55 / 1536 * 100%);
  height:calc(55 / 2048 * 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(14px,2.5vw,28px)
}

.lyrics{
  position:absolute;
  left:50%;
  top:47%;
  transform:translateX(-50%);
  width:62%;
  text-align:center;
  color:rgba(255,255,255,.96);
  font-size:clamp(9px,2.1vw,23px);
  font-weight:800;
  line-height:1.2;
  text-shadow:0 2px 5px rgba(0,0,0,.65)
}

.comment-area{
  position:absolute;
  left:calc(315 / 1536 * 100%);
  top:calc(1225 / 2048 * 100%);
  width:calc(805 / 1536 * 100%);
  height:calc(597 / 2048 * 100%);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:3% 2.2% 3%
}

.comment{
  width:fit-content;
  max-width:96%;
  margin-top:1.5%;
  padding:1.25% 2.5%;
  border-radius:999px;
  background:rgba(45,45,55,.76);
  color:#fff;
  font-size:clamp(7px,1.45vw,15px);
  font-weight:700;
  line-height:1.25;
  text-shadow:0 1px 2px rgba(0,0,0,.5)
}

.comment.highlight{
  background:rgba(71,157,220,.78)
}

.comment .name{
  margin-right:.5em;
  opacity:.82
}

.side-button{
  position:absolute;
  left:calc(1146 / 1536 * 100%);
  width:calc(71 / 1536 * 100%);
  aspect-ratio:1;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(80,82,91,.78);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 3px 8px rgba(0,0,0,.25);
  color:#fff;
  font-size:clamp(10px,2vw,20px)
}

.side-button.one{
  top:calc(1505 / 2048 * 100%)
}

.side-button.two{
  top:calc(1626 / 2048 * 100%)
}

.side-button.three{
  top:calc(1747 / 2048 * 100%)
}

.comment-input{
  position:absolute;
  left:calc(315 / 1536 * 100%);
  top:calc(1854 / 2048 * 100%);
  width:calc(563 / 1536 * 100%);
  height:calc(100 / 2048 * 100%);
  border-radius:999px;
  background:rgba(35,35,42,.82);
  border:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  padding-left:5%;
  color:rgba(255,255,255,.7);
  font-size:clamp(7px,1.4vw,15px)
}

.bottom-button{
  position:absolute;
  top:calc(1868 / 2048 * 100%);
  width:calc(71 / 1536 * 100%);
  aspect-ratio:1;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(80,82,91,.78);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  font-size:clamp(10px,2vw,20px);
  box-shadow:0 3px 8px rgba(0,0,0,.25)
}

.bottom-button.one{
  left:calc(903 / 1536 * 100%)
}

.bottom-button.two{
  left:calc(1024 / 1536 * 100%)
}

.bottom-button.three{
  left:calc(1146 / 1536 * 100%)
}

.ui-toggle{
  position:absolute;
  right:8px;
  bottom:8px;
  width:40px;
  height:40px;
  border-radius:999px;
  border:none;
  font-size:18px;
  cursor:pointer;
  background:rgb(var(--ink)/.7);
  color:rgb(var(--paper));
  box-shadow:0 2px 8px rgba(0,0,0,.3);
  z-index:200
}

.ui-toggle.active{
  background:rgb(var(--coral));
  color:rgb(var(--ink))
}

.device-panel{
  margin-top:16px;
  border-radius:20px;
  border:2px solid rgb(var(--line));
  background:rgb(var(--panel));
  padding:20px
}

.device-panel.prompt{
  border-color:rgb(var(--coral));
  animation:softPulse 1.8s ease-in-out infinite
}

.device-panel .label{
  margin:0 0 8px;
  font-size:12px;
  font-weight:700;
  color:rgb(var(--muted))
}

.device-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

@media(min-width:480px){
  .device-grid{
    grid-template-columns:repeat(4,1fr)
  }
}

.device-card{
  text-align:left;
  border-radius:16px;
  border:2px solid rgb(var(--line));
  background:transparent;
  color:rgb(var(--paper));
  padding:12px;
  cursor:pointer
}

.device-card.active{
  border-color:rgb(var(--coral));
  background:rgb(var(--coral)/.1)
}

.device-card .row{
  display:flex;
  align-items:center;
  gap:8px
}

.device-card .dot{
  width:16px;
  height:16px;
  border-radius:999px;
  border:2px solid rgb(var(--line));
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center
}

.device-card.active .dot{
  border-color:rgb(var(--coral))
}

.device-card.active .dot:after{
  content:"";
  width:8px;
  height:8px;
  border-radius:999px;
  background:rgb(var(--coral))
}

.device-card .name{
  font-size:13px;
  font-weight:700
}

.device-card .ratio{
  display:block;
  margin-top:4px;
  font-size:11px;
  color:rgb(var(--muted))
}

.device-note{
  margin-top:8px;
  font-size:12px;
  color:rgb(var(--muted))
}
</style>
</head>

<body>

<header>
  <div>
    <h1>配信プレビューさん</h1>
    <p>カスタム背景が配信でどう見えるか確認できます</p>
  </div>

  <button
    class="theme-btn"
    id="themeBtn"
    aria-label="ライト/ダークモード切替"
  >
    🌙
  </button>
</header>

<main>

<button
  class="upload-btn pulse"
  id="uploadBtn"
>
  🖼 画像をアップロード
</button>

<input
  type="file"
  id="fileInput"
  accept="image/png,image/jpeg,image/webp"
  style="display:none"
>

<div
  class="preview"
  id="preview"
>

  <canvas
    id="canvas"
    width="1536"
    height="2048"
  ></canvas>

  <div
    class="shade left"
    id="shadeLeft"
  ></div>

  <div
    class="shade right"
    id="shadeRight"
  ></div>

  <!-- 左右の境界線 -->
  <div
    class="crop-line left"
    id="cropLineLeft"
  ></div>

  <div
    class="crop-line right"
    id="cropLineRight"
  ></div>

  <div
    class="badge"
    id="badge"
  ></div>

  <div
    class="placeholder"
    id="placeholder"
  >
    画像をアップロードすると、<br>
    配信画面を再現したプレビューを表示します
  </div>

  <div id="uiGuide">

    <div class="creator-avatar"></div>

    <div class="creator-name fake-ui">
      配信者A
    </div>

    <div class="creator-info fake-ui">
      ♡ 33　配信中
    </div>

    <div class="listener-avatar a">A</div>
    <div class="listener-avatar b">B</div>
    <div class="listener-avatar c">C</div>
    <div class="listener-avatar d">D</div>

    <div class="close-button fake-ui">
      ×
    </div>

    <div class="lyrics">
      ここに歌詞が表示される
    </div>

    <div class="comment-area">

      <div class="comment">
        <span class="name">リスナーA</span>
        こんにちは！
      </div>

      <div class="comment highlight">
        <span class="name">リスナーB</span>
        素敵な歌声です！
      </div>

      <div class="comment">
        <span class="name">リスナーC</span>
        今日も楽しみにしてました
      </div>

      <div class="comment highlight">
        <span class="name">リスナーD</span>
        👏👏👏
      </div>

      <div class="comment">
        <span class="name">リスナーE</span>
        ありがとうございます！
      </div>

      <div class="comment">
        <span class="name">リスナーF</span>
        次の曲も楽しみです
      </div>

      <div class="comment highlight">
        <span class="name">リスナーG</span>
        すごく綺麗です✨
      </div>

      <div class="comment">
        <span class="name">リスナーH</span>
        聴いてます！
      </div>

    </div>

    <div class="side-button one">♡</div>
    <div class="side-button two">🎁</div>
    <div class="side-button three">♪</div>

    <div class="comment-input">
      コメントを入力…
    </div>

    <div class="bottom-button one">☁</div>
    <div class="bottom-button two">♛</div>
    <div class="bottom-button three">…</div>

  </div>

  <button
    class="ui-toggle"
    id="uiToggleBtn"
    aria-label="配信画面UIとの重なりを確認"
  >
    👥
  </button>

</div>

<div
  class="device-panel"
  id="devicePanel"
>

  <p class="label">
    📱 端末を選択
  </p>

  <div
    class="device-grid"
    id="deviceGrid"
  ></div>

  <p
    class="device-note"
    id="deviceNote"
  ></p>

</div>

</main>

<script>
(function(){

  const W = 1536;
  const H = 2048;

  const DEVICES = [

    {
      id:"iphone",
      label:"iPhone",
      ratioLabel:"19.5:9",
      aspect:1179/2556,
      note:"上下は画面いっぱい、左右が見切れます"
    },

    {
      id:"xperia10vi",
      label:"Xperia 10 VI",
      ratioLabel:"21:9",
      aspect:1080/2520,
      note:"上下は画面いっぱい、左右が大きく見切れます"
    },

    {
      id:"other-major",
      label:"その他の主要スマホ",
      ratioLabel:"20:9目安",
      aspect:9/20,
      note:"iPhone/Xperia以外の機種の目安です"
    },

    {
      id:"ipad",
      label:"iPad（A16）",
      ratioLabel:"59:41",
      aspect:1640/2360,
      note:"上下左右とも、ほぼ画面いっぱいに表示されます"
    }

  ];


  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");

  const uploadBtn =
    document.getElementById("uploadBtn");

  const fileInput =
    document.getElementById("fileInput");

  const guide =
    document.getElementById("uiGuide");

  const shadeLeft =
    document.getElementById("shadeLeft");

  const shadeRight =
    document.getElementById("shadeRight");

  const cropLineLeft =
    document.getElementById("cropLineLeft");

  const cropLineRight =
    document.getElementById("cropLineRight");

  const badge =
    document.getElementById("badge");

  const placeholder =
    document.getElementById("placeholder");

  const toggle =
    document.getElementById("uiToggleBtn");

  const panel =
    document.getElementById("devicePanel");

  const grid =
    document.getElementById("deviceGrid");

  const note =
    document.getElementById("deviceNote");

  const themeBtn =
    document.getElementById("themeBtn");


  let bgImage = null;

  let selectedDeviceId = null;

  let showUiGuide = false;


  /* =========================================================
     背景画像を描画
     ========================================================= */

  function draw(){

    ctx.clearRect(
      0,
      0,
      W,
      H
    );

    if(!bgImage){

      const g =
        ctx.createLinearGradient(
          0,
          0,
          0,
          H
        );

      g.addColorStop(
        0,
        "#1D1B29"
      );

      g.addColorStop(
        1,
        "#14131C"
      );

      ctx.fillStyle = g;

      ctx.fillRect(
        0,
        0,
        W,
        H
      );

      placeholder.style.display =
        "flex";

      return;
    }

    placeholder.style.display =
      "none";

    const s =
      H / bgImage.height;

    const dw =
      bgImage.width * s;

    ctx.drawImage(
      bgImage,
      (W - dw) / 2,
      0,
      dw,
      H
    );
  }


  /* =========================================================
     左右の見切れ幅
     ========================================================= */

  function margin(aspect){

    return Math.max(
      0,
      (1 - aspect * (H / W)) / 2
    );
  }


  /* =========================================================
     プレビュー状態を更新
     ========================================================= */

  function update(){

    const d =
      DEVICES.find(
        x => x.id === selectedDeviceId
      ) || null;


    if(d){

      const m =
        margin(d.aspect);


      if(m > .001){

        const width =
          m * 100 + "%";


        /*
         * 見切れ部分
         */

        shadeLeft.style.width =
          width;

        shadeRight.style.width =
          width;


        /*
         * 境界線
         *
         * 左線は「見切れ幅」の終点
         * 右線は「見切れ幅」の終点
         *
         * right側もleft座標として計算することで、
         * Xperia 10 VIの右側でも確実に表示する。
         */

        const position =
          m * 100 + "%";

        cropLineLeft.style.left =
          position;

        cropLineRight.style.left =
          (100 - m * 100) + "%";


        cropLineLeft.style.display =
          "block";

        cropLineRight.style.display =
          "block";


        badge.style.display =
          "block";

        badge.className =
          "badge warn";

        badge.textContent =
          "⚠️ " +
          d.label +
          "は左右が見切れます";

      }else{

        shadeLeft.style.width =
          "0%";

        shadeRight.style.width =
          "0%";


        cropLineLeft.style.display =
          "none";

        cropLineRight.style.display =
          "none";


        badge.style.display =
          "block";

        badge.className =
          "badge ok";

        badge.textContent =
          "✅ " +
          d.label +
          "はほぼ全体が見えます";
      }


      note.textContent =
        d.note;

    }else{

      shadeLeft.style.width =
        "0%";

      shadeRight.style.width =
        "0%";


      cropLineLeft.style.display =
        "none";

      cropLineRight.style.display =
        "none";


      badge.style.display =
        "none";

      note.textContent =
        "";
    }


    guide.classList.toggle(
      "visible",
      showUiGuide
    );

    toggle.classList.toggle(
      "active",
      showUiGuide
    );

    panel.classList.toggle(
      "prompt",
      !!bgImage && !selectedDeviceId
    );
  }


  /* =========================================================
     HTMLエスケープ
     ========================================================= */

  function esc(v){

    return String(v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }


  /* =========================================================
     端末ボタンを生成
     ========================================================= */

  function render(){

    grid.innerHTML = "";


    DEVICES.forEach(d => {

      const b =
        document.createElement("button");

      b.type =
        "button";

      b.className =
        "device-card" +
        (
          selectedDeviceId === d.id
            ? " active"
            : ""
        );


      b.innerHTML =
        '<span class="row">' +

          '<span class="dot"></span>' +

          '<span class="name">' +
            esc(d.label) +
          '</span>' +

        '</span>' +

        '<span class="ratio">' +
          esc(d.ratioLabel) +
        '</span>';


      b.onclick = () => {

        selectedDeviceId =
          selectedDeviceId === d.id
            ? null
            : d.id;

        render();

        update();
      };


      grid.appendChild(b);
    });
  }


  /* =========================================================
     アップロードボタン
     ========================================================= */

  uploadBtn.onclick = () => {

    fileInput.click();
  };


  /* =========================================================
     画像選択
     ========================================================= */

  fileInput.onchange = e => {

    const f =
      e.target.files &&
      e.target.files[0];


    if(!f) return;


    if(!f.type.startsWith("image/")){

      alert(
        "画像ファイルを選択してください。"
      );

      return;
    }


    const r =
      new FileReader();


    r.onload = () => {

      const img =
        new Image();


      img.onload = () => {

        bgImage =
          img;

        uploadBtn.textContent =
          "🔄 画像を変更する";

        uploadBtn.classList.remove(
          "pulse"
        );

        draw();

        update();
      };


      img.onerror = () => {

        alert(
          "画像を読み込めませんでした。"
        );
      };


      img.src =
        r.result;
    };


    r.readAsDataURL(f);
  };


  /* =========================================================
     配信UI表示切替
     ========================================================= */

  toggle.onclick = () => {

    showUiGuide =
      !showUiGuide;

    update();
  };


  /* =========================================================
     テーマ
     ========================================================= */

  const KEY =
    "haishin-preview:theme";


  function apply(t){

    document.documentElement
      .classList
      .toggle(
        "light",
        t === "light"
      );


    themeBtn.textContent =
      t === "light"
        ? "☀️"
        : "🌙";
  }


  apply(
    localStorage.getItem(KEY) ||
    "dark"
  );


  themeBtn.onclick = () => {

    const cur =
      document.documentElement
        .classList
        .contains("light")
        ? "light"
        : "dark";


    const next =
      cur === "light"
        ? "dark"
        : "light";


    apply(next);


    localStorage.setItem(
      KEY,
      next
    );
  };


  /* =========================================================
     初期化
     ========================================================= */

  render();

  draw();

  update();

})();
</script>

</body>
</html>
